name: Spellcheck Markdown documentation

on:
  push:            # run on push events in the docs subfolder
   paths:
     - 'docs/**'
  workflow_dispatch:
  schedule:
  - cron: '30 1 * * *' # daily at 01:30 UTC

uses: streetsidesoftware/cspell-action@v8
with:
    config: docs/web/cspell.json
    root: .
    files: |
      docs/web/**/*.md
    incremental_files_only: false
    inline: warning
    suggestions: true
    strict: true
    report: all
